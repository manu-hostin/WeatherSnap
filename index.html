<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSnap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>WeatherSnap ☀️</h1>
        <div id="topicos">
            <div id="inicio">
                <img src="src/casa-icone.webp" alt="Ícone de casa">
                <p>Início</p>
            </div>
            <div id="comparacao">
                <img src="src/barras.png" alt="Ícone de barras">
                <p>Comparar</p>
                <p id="numero-comparacoes">3</p>
            </div>
        </div>
    </header>

    <main>
        <div id="busca">
            <div id="area-busca">
                <img src="src/lupa.png" alt="">
                <input type="text" name="busca" id="buscar" placeholder="Buscar cidade...">
            </div>
            <button id="botao-buscar">Buscar</button>
        </div>
        <section>
            <div id="cidade">
                <div id="info-cidade">
                    <h3>Cidade, Estado</h3>
                    <p>Dia da semana, dia</p>
                </div>
                <div id="imagens-sessao-cidade">
                    <img src="src/barras.png" alt="Gráfico de barras">
                    <img src="src/icone-compartilhar.png" alt="Ícone de compartilhamento">
                </div> 
            </div>
            <div id="temperatura">
                <img src="src/nublado.png" alt="Emoji de nuvem">
                <h2>24°C</h2>
            </div>
            <div id="tempo">
                <h5>Nublado</h5>
                <div id="dados-tempo">
                    <div class="dados-inferiores">
                        <img src="src/vento.png" alt="Ícone de vento">
                        <p>15.3 km/h</p>
                    </div>
                    <div class="dados-inferiores">
                        <img src="src/umidade.png" alt="Ícone de umidade">
                        <p>63%</p>
                    </div>
                </div>
            </div>
            <div id="sugestao-inteligente">
                <p>Que tal aproveitar para um museu ou cinema hoje?</p>
            </div>
            <h5 id="h5-proximo">Próximos dias</h5>
            <div id="proximos-dias">
                <div class="dia">
                    <p class="dia-semana"></p>
                    <img class="icone-dia" src="" alt="Ícone">
                    <p class="proxima-temp"></p>
                </div>
            
                <div class="dia">
                    <p class="dia-semana"></p>
                    <img class="icone-dia" src="" alt="Ícone">
                    <p class="proxima-temp"></p>
                </div>
            
                <div class="dia">
                    <p class="dia-semana"></p>
                    <img class="icone-dia" src="" alt="Ícone">
                    <p class="proxima-temp"></p>
                </div>
            </div>
            
        </section>
    </main>
    
    <script src="script.js"></script>

</body>
</html>
