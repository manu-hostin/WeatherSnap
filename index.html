<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSnap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>WeatherSnap ☀️</h1>
        <div id="topicos">
            <p>🏘️ Início</p>
            <div id="comparacao">
                <p>📊 Comparar</p>
                <p>3</p>
            </div>
        </div>
    </header>

    <main>
        <div id="busca">
            <p>🔎 Buscar cidade...</p>
            <button>Buscar</button>
        </div>
        <div id="cidade">
            <h3>Cidade, Estado</h3>
            <p>Dia da semana, dia</p>
            <img src="src/barras" alt="Gráfico de barras">
            <img src="src/compartilhar.png" alt="Ícone de compartilhamento">
        </div>
        <div id="temperatura">
            <img src="src/nuvem.png" alt="Emoji de nuvem">
            <h2>temperatura</h2>
        </div>
        <div id="tempo">
            <h5>Tempo</h5>
            <div id="dados-tempo">
                <div id="vento">
                    <img src="" alt="">
                    <p></p>
                </div>
                <div id="chuva">
                    <img src="" alt="">
                    <p></p>
                </div>
            </div>
        </div>


    </main>
</body>
</html>
